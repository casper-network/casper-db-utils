[package]
name = "casper-db-utils"
version = "0.2.0-dev+casper.node.2.0.0"
authors = ["George Pisaltu <georgep@casperlabs.io>"]
edition = "2024"
description = "Utilities for working with databases of the Casper blockchain."
documentation = "https://docs.rs/casper-db-utils"
readme = "README.md"
homepage = "https://casperlabs.io"
repository = "https://github.com/casper-network/casper-db-utils"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
anyhow = "1"
bincode = "1.3.3"
casper-node = "2"
casper-execution-engine = "8.1.0"
casper-types = { version="6", features = [
    "json-schema",
    "std",
] }
casper-storage = { version="2" }
clap = { version = "3", features = ["cargo"] }
futures = "0.3.21"
lmdb-rkv = "0.14"
lmdb-sys = "0.8.0"
log = "0"
once_cell = "1"
reqwest = { version = "0", features = ["stream"] }
ringbuf = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12.0"
tar = "0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
zstd = "0"

[dev-dependencies]
once_cell = "1"
rand = "0.9.1"
tempfile = "3"

[build-dependencies]
cargo-lock = { version = "10", default-features = false }
